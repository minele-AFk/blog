name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security regression tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Check known dependency vulnerabilities
        run: npm run audit:security

      # OpenNext 不兼容 Windows，必须在 Linux CI 上构建（本地 Windows 构建会崩溃 0xC0000409）
      - name: Build for Cloudflare Workers
        run: npm run build:cf

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify deployed site
        timeout-minutes: 2
        run: |
          for path in / /api/admin/projects; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 5 --max-time 15 \
              --output /dev/null "https://blog.1653500384.workers.dev${path}"
          done
